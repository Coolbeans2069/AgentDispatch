name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        extras: ["stdlib-only", "with-sympy"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional test extras
        if: matrix.extras == 'with-sympy'
        run: python -m pip install -r requirements-dev.txt "mcp>=1.2"
      - name: Run the test suite
        run: python tests/run_all.py
      - name: Engine Room integration
        run: python tests/integration_engineroom.py
      - name: Business demo MCP server (examples/mcp-b1-demo)
        run: python examples/mcp-b1-demo/tests/run_tests.py
