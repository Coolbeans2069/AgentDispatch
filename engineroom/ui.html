<!doctype html><html><head><meta charset="utf-8"><title>ENGINE ROOM · AgentDispatch</title>
<style>
:root{--bg:#02070d;--text:#d8f8ff;--dim:#6aa9bd}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#06304a 0,#02070d 55%) fixed,#02070d;color:var(--text);font:11px ui-monospace,Consolas,monospace;user-select:none;overflow:auto}
#engine{--gs:138px;padding:6px 10px 8px;background:linear-gradient(#2b2218,#16100b);border:1px solid #7a5428;border-radius:12px;margin:6px;box-shadow:0 10px 34px #000b,inset 0 1px 0 #ffffff14;color:#e8d9b8}
#engine .hd{display:flex;align-items:center;gap:8px;padding:2px 4px 6px}
#engine .ttl{letter-spacing:.2em;font-weight:700;color:#e0ae52;font-size:12px}
#engine .sum{color:#bfae88;font-size:10px;flex:1;white-space:nowrap}
#engine .hd button.on{background:#6b4a26;color:#fff;border-color:#e0ae52}
#jobs{margin:6px 8px;padding:6px 10px;background:#06141f;border:1px solid #0e4a63;border-radius:6px;font-size:10px;color:#cdbb92}
#jobs b{color:#e8f4ff}#jobs .n{color:#ff9a3d}#jobs .ag2{display:inline-block;margin:2px 8px 0 0}#jobs .ag2.off{opacity:.45}
#jobs .need{margin:2px 0;color:#ffd34d}#jobs .hint{color:#7d6f52}
#agents{display:flex;flex-wrap:wrap;gap:4px 12px;margin:0 8px 4px;font-size:10px;color:#7d6f52}
#agents .ag i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:#3a2c1c;border:1px solid #6b4a26}
#agents .ag.on{color:#e8d9b0}#agents .ag.on i{background:#19f0c8;border-color:#19f0c8;box-shadow:0 0 6px #19f0c8}
#engine .hd button{background:#3a2c1c;color:#e0c48c;border:1px solid #6b4a26;border-radius:5px;padding:0 6px;font-size:10px;cursor:pointer;line-height:16px}
#engine .grid{display:grid;grid-template-columns:repeat(var(--cols,4),var(--gs));gap:6px 10px;justify-content:center}
#engine .cell{width:var(--gs);text-align:center}
#engine svg.gauge{width:var(--gs);height:var(--gs);display:block;filter:drop-shadow(0 3px 4px #0009)}
#engine .needle{transition:transform .9s cubic-bezier(.34,1.5,.55,1);transform-origin:60px 60px}
#engine .rd{font-size:10px;line-height:1.3;color:#cdbb92;min-height:40px;margin-top:-2px}
#engine .rd b{font-weight:700}
#engine .rd .k{display:block;color:#7d6f52;font-size:8px;line-height:1.1}
.nb{color:#4da3ff}.nc{color:#9eeaff}.ny{color:#ffd34d}.na{color:#ff9a1a}
#engine .lamp{width:10px;height:10px;border-radius:50%;background:#19f0c8;box-shadow:0 0 7px #19f0c8}
#engine.over .lamp{background:#ff3b30;box-shadow:0 0 10px #ff3b30;animation:pulse .6s infinite}
#engine.working .lamp{background:#f0a83a;box-shadow:0 0 9px #f0a83a;animation:pulse 1s infinite}
#engine .down{opacity:.45;filter:grayscale(.8)}
@keyframes pulse{50%{opacity:.3}}
/* bar panels stay capped so Auto/S/M/L gauge sizing still fills the window (a long OpenRouter list must scroll, not crush the dials) */
#gem,#or{margin:8px 4px 2px;padding:6px 8px;background:#0a0f18;border:1px solid #0e4a63;border-radius:8px;max-height:150px;overflow-y:auto;overflow-x:hidden}
#gem .gh,#or .gh{color:#7fb5c8;font-size:9.5px;margin-bottom:4px;position:sticky;top:0;background:#0a0f18;z-index:1;padding-bottom:2px}
#gem .gr,#or .gr{display:grid;grid-template-columns:12px 120px 1fr 220px;gap:6px;align-items:center;padding:1.5px 0}
#gem .gr i,#or .gr i{width:9px;height:9px;border-radius:50%;display:inline-block}
#gem .gl,#or .gl{color:#d8f8ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#gem .gb,#or .gb{position:relative;height:9px;background:#142230;border-radius:5px;overflow:hidden}
#gem .gb u,#or .gb u{position:absolute;left:0;top:0;bottom:0;border-radius:5px;min-width:2px;opacity:.9;transition:width .8s}
#gem .gb s,#or .gb s{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#e8f4ff;opacity:.7}
#gem .gb.hot,#or .gb.hot{outline:1px solid #ff3b30}
#gem .gt,#or .gt{color:#cdbb92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#gem .gt b,#or .gt b{color:#fff}#gem .k,#or .k{color:#7d6f52;font-size:9px;margin-left:4px}
#say{margin:0 6px 6px;padding:5px 10px;background:#06141f;border:1px solid #0e4a63;border-radius:6px;color:#9fe8ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body>
<div id="engine"><div class="hd"><span class="lamp"></span><span class="ttl">ENGINE ROOM</span><span class="sum">paging the system ...</span>

<script>

  sv("linearGradient",{id:id+"g",x1:"0",y1:"0",x2:"0",y2:"1"},sv("stop",{offset:"0","stop-color":"#fff","stop-opacity":".38"}),sv("stop",{offset:".5","stop-color":"#fff","stop-opacity":".04"}),sv("stop",{offset:"1","stop-color":"#fff","stop-opacity":"0"}))));
 svg.append(sv("circle",{cx:60,cy:60,r:58,fill:"url(#"+id+"b)"}),sv("circle",{cx:60,cy:60,r:53.5,fill:"#010608"}),sv("circle",{cx:60,cy:60,r:51,fill:"url(#"+id+"f)"}));
 [45,135,225,315].forEach(d=>{const [x,y]=polar(56,d);svg.append(sv("circle",{cx:x,cy:y,r:1.4,fill:"#00e5ff"}))});

 for(let i=0;i<=o.ticks*2;i++){const major=i%2===0,deg=A_START+SWEEP*i/(o.ticks*2),[x0,y0]=polar(major?39:42,deg),[x1,y1]=polar(48,deg);
  svg.append(sv("line",{x1:x0,y1:y0,x2:x1,y2:y1,stroke:"#5fe9ff","stroke-width":major?1.3:.7}))}

 svg.append(sv("text",{x:60,y:84,"text-anchor":"middle","font-size":8,"letter-spacing":".12em",fill:"#00e5ff","font-weight":"bold"},document.createTextNode(title)));

 const ns=[],ND=o.nd||NEEDLES;
 (o.nd?ND.map((_,i)=>i).reverse():[2,3,1,0]).forEach(i=>{const [col,len,w]=ND[i];const g=sv("g",{class:"needle",style:"transform:rotate(-120deg);filter:drop-shadow(0 0 2.5px "+col+") drop-shadow(0 0 5px "+col+")"});

 svg.append(sv("circle",{cx:60,cy:60,r:5.5,fill:"url(#"+id+"b)",stroke:"#00e5ff","stroke-width":.7}),sv("circle",{cx:60,cy:60,r:1.8,fill:"#010608"}));

 return {svg,set(i,f){if(f==null||isNaN(f))f=0;ns[i].style.transform="rotate("+(A_START+SWEEP*Math.max(0,Math.min(1,f)))+"deg)"},lamp(c){lamp.setAttribute("fill",c)}};

const grid=document.querySelector(".grid"),box=document.getElementById("engine");let G={},N=-1;

function panelReserve(id,cap){
 /* use the visible height of a bar panel, but never more than cap: otherwise a long OpenRouter list starves Auto layout */
 const e=document.getElementById(id);if(!e)return 0;return Math.min(e.offsetHeight||0,cap)
}
function fit(){
 /* the dials fill whatever size the window is: pick the number of columns that makes the dials biggest while everything still fits (no scrolling), re-done when the window is resized */
 const n=grid.children.length||1,W=innerWidth-44;
 const H=innerHeight-box.querySelector(".hd").offsetHeight-(document.getElementById("agents").offsetHeight||0)-document.getElementById("say").offsetHeight-panelReserve("gem",150)-panelReserve("or",150)-(document.getElementById("jobs").offsetHeight||0)-70;
 let best=null;
 for(let c=1;c<=Math.min(n,10);c++){const rows=Math.ceil(n/c),gs=Math.min(W/c-10,H/rows-80);if(!best||gs>best.gs)best={c,gs}}
 if(FIXED){const c=Math.max(1,Math.min(n,Math.floor(W/(FIXED+10))));box.style.setProperty("--gs",FIXED+"px");box.style.setProperty("--cols",c);return}
 box.style.setProperty("--gs",Math.max(70,Math.min(260,Math.floor((best&&best.gs)||70)))+"px");box.style.setProperty("--cols",(best&&best.c)||1)}

async function setLimit(k,t){
 const a=prompt(t+": percent used of the 5-hour limit (leave empty if this plan has none):","");if(a===null)return;
 const ah=a===""?null:prompt(t+": the 5-hour limit resets in how many MINUTES?","60");
 const w=prompt(t+": percent used of the WEEKLY limit:","");if(w===null)return;
 const wd=prompt(t+": the weekly limit resets in how many HOURS?","72");if(wd===null)return;
 const now=Date.now(),ws=[];

 await fetch("/limit",{method:"POST",body:JSON.stringify({name:k,windows:ws,source:"typed in the engine room"})});
}

   (ag.needs_you&&ag.needs_you.length?"<div class='need'>NEEDS YOU: "+ag.needs_you.map(n=>n.id+" ["+n.state+"] "+n.title+(n.why?" - "+n.why:"")).join(" | ")+"</div><div class='hint'>act with: python -m agentdispatch agency list / the broker's owner endpoints</div>":"")}

 (s.gpus||[]).forEach(g=>{const x=G["g"+g.index];if(!x)return;const v=g.total?g.used/g.total:0,bv=g.total?(g.bot_vram||0)/g.total:0,bl=g.bot_on?g.util/100:0;
  x.set(0,g.util/100);x.set(1,v);x.set(2,bl);x.set(3,bv);x.lamp(g.bot_on?"#ffd34d":"#19f0c8");
  x.rd.innerHTML=rd4(f0(g.util)+"%",(g.used/1024).toFixed(1)+"G",g.bot_on?f0(g.util)+"%":"0%",((g.bot_vram||0)/1024).toFixed(1)+"G","load · VRAM · bots load · bots VRAM")+"<br>"+f0(g.temp)+"°C "+g.name.replace("NVIDIA ","")});

 G.ram.set(0,s.ram/100);G.ram.set(1,p("ram")/100);G.ram.set(2,b.ram/100);G.ram.set(3,p("bram")/100);G.ram.lamp(over.includes("ram")?"#ff3b30":"#19f0c8");

  gp.querySelector(".gh").innerHTML="GEMINI free tier today &nbsp;·&nbsp; bars show use of each model's daily limit &nbsp;·&nbsp; tick = the bots' half share &nbsp;·&nbsp; bots now: "+(l.rpm_f!=null?f0((l.rpm_f||0)*100)+"% of the per-minute cap":"")+" · local share "+f0((l.local_f||0)*100)+"%";
  gp.querySelectorAll(".gr").forEach((r,i)=>{const m=GM[i];if(!m)return;r.querySelector("u").style.width=(m.frac*100)+"%";r.querySelector(".gb").classList.toggle("hot",m.frac>.8);
