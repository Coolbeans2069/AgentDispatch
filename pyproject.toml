[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdispatch"
version = "0.1.1"
description = "Local AI agent broker for small businesses: MCP server, job queue, independent review gate and local-first (Ollama) model routing, with audit trails and approvals"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Coolbeans2069" }]
keywords = ["ai-agents", "mcp", "llm", "automation", "python", "ollama", "local-llm", "model-context-protocol"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# The broker itself has no dependencies: the standard library only.
dependencies = []

[project.optional-dependencies]
calc = ["sympy", "mpmath", "numpy", "scipy"]
engineroom = ["psutil"]
media = ["Pillow", "opencv-python-headless", "faster-whisper", "imageio", "pydub", "soundfile"]
docs = ["pypdf", "PyMuPDF", "python-docx", "openpyxl", "pandas", "markdown", "mistune", "jsonschema"]
web = ["httpx", "playwright"]
units = ["pint", "astropy"]
all = ["agentdispatch[calc,engineroom,media,docs,web,units]"]
test = ["sympy", "mpmath"]

[project.urls]
Homepage = "https://github.com/Coolbeans2069/AgentDispatch"
Issues = "https://github.com/Coolbeans2069/AgentDispatch/issues"

[tool.setuptools.packages.find]
include = ["agentdispatch*", "engineroom*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.html", "*.txt", "*.py"]
